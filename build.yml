name: Build AdSwitch APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o AdSwitch-prototype-v1.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd AdSwitch && gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AdSwitch-debug
          path: AdSwitch/app/build/outputs/apk/debug/app-debug.apk
